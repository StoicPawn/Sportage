name: local-verify-deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportage-local-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, sportage-local]
    timeout-minutes: 60
    steps:
      - name: Deploy trusted main as read-only ACEPC production monitor
        run: |
          set -euo pipefail
          PROD=/home/stoicpawn/projects/Sportage
          cd "$PROD"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has tracked local changes; refusing to overwrite them."
            git status --short
            exit 1
          fi
          git fetch origin main
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET="${{ github.event.workflow_run.head_sha }}"
          else
            TARGET="$(git rev-parse origin/main)"
          fi
          git checkout main
          git reset --hard "$TARGET"
          [ -x .venv/bin/python ] || python3 -m venv .venv
          nice -n 15 .venv/bin/python -m pip install -e ".[ui]"
          mkdir -p data
          if [ ! -f .env ]; then
            cp .env.example .env
            chmod 600 .env
            echo "Created production .env with live execution disabled; direct broker credentials remain empty until configured."
          fi
          chmod 600 .env

          .venv/bin/python - <<'PY'
          from pathlib import Path
          from arbengine.providers.scheduler import load_scheduler_config
          from arbengine.result_archive import _market_signature
          from arbengine.betfair_auth import configured
          cfg = load_scheduler_config(Path('config/provider_scheduler.acepc.json'))
          assert cfg.max_workers <= 2 and cfg.tick_seconds >= 5
          assert callable(_market_signature)
          print(f"ACEPC scheduler OK: tick={cfg.tick_seconds}s workers={cfg.max_workers}; betfair_auth_configured={configured()}")
          PY
          bash -n ops/run_shadow.sh
          bash -n ops/run_results.sh
          grep -q 'SPORTAGE_LIVE_EXECUTION=false' ops/systemd/sportage.service
          grep -q 'SPORTAGE_LIVE_EXECUTION=false' ops/systemd/sportage-shadow.service
          grep -q 'SPORTAGE_LIVE_EXECUTION=false' ops/systemd/sportage-results.service

          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"
          USER_UNITS="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
          mkdir -p "$USER_UNITS"
          if [ ! -f "$USER_UNITS/side-projects.slice" ]; then
            SIDE_QUOTA="$(python3 - <<'PY'
          import os
          print(f"{max(1.0, (os.cpu_count() or 1) * 0.15 * 100):.1f}%")
          PY
            )"
            cat > "$USER_UNITS/side-projects.slice" <<EOF
          [Unit]
          Description=GoldenBull and Sportage shared CPU envelope
          [Slice]
          CPUQuota=$SIDE_QUOTA
          CPUWeight=100
          EOF
          fi

          install -m 0644 ops/systemd/sportage.service "$USER_UNITS/sportage.service"
          install -m 0644 ops/systemd/sportage-shadow.service "$USER_UNITS/sportage-shadow.service"
          install -m 0644 ops/systemd/sportage-results.service "$USER_UNITS/sportage-results.service"
          install -m 0644 ops/systemd/sportage-results.timer "$USER_UNITS/sportage-results.timer"
          systemctl --user daemon-reload
          systemctl --user enable --now sportage.service sportage-shadow.service sportage-results.timer
          systemctl --user restart sportage.service sportage-shadow.service
          systemctl --user start --no-block sportage-results.service

          UI_OK=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8501/ >/dev/null; then UI_OK=1; break; fi
            sleep 2
          done
          if [ "$UI_OK" != 1 ] || ! systemctl --user is-active --quiet sportage-shadow.service; then
            systemctl --user status sportage.service sportage-shadow.service sportage-results.timer --no-pager || true
            journalctl --user -u sportage.service -u sportage-shadow.service -u sportage-results.service -n 160 --no-pager || true
            exit 1
          fi

          APPKEY=0; CERT=0; STATIC=0
          grep -Eq '^BETFAIR_APP_KEY=.+' .env && APPKEY=1 || true
          grep -Eq '^BETFAIR_SESSION_TOKEN=.+' .env && STATIC=1 || true
          CERT_PATH="$(sed -n 's/^BETFAIR_CERT_FILE=//p' .env | tail -1)"
          KEY_PATH="$(sed -n 's/^BETFAIR_KEY_FILE=//p' .env | tail -1)"
          if [ -n "$CERT_PATH" ] && [ -n "$KEY_PATH" ] && [ -f "$CERT_PATH" ] && [ -f "$KEY_PATH" ]; then CERT=1; fi
          echo "Sportage UI healthy; direct shadow/result workers enabled; app_key=${APPKEY}; static_session=${STATIC}; cert_pair=${CERT}; live execution hard-disabled."
