[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sportage-arbitrage"
version = "0.11.0"
description = "Net sports-arbitrage scanner with adaptive scheduling, lifecycle analytics and fail-closed independent multi-exchange rescue routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
ui = ["streamlit>=1.37,<2", "pandas>=2.2,<3"]

[project.scripts]
arbengine = "arbengine.cli:app"
sportage = "arbengine.cli:app"
sportage-exec = "arbengine.execution_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arbengine"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/arbengine",
  "/config",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
